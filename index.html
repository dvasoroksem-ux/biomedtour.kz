<style>
/* Layout: одна колонка до 720px, сначала телефон; блоки и списки собраны сеткой с gap */
:root{
  --bg:#120A2A;
  --plate:#3B1A7A;
  --accent:#AC49DE;
  --cyan:#6FE7FF;
  --lav:#B9A6FF;
  --text:#FDFBF5;
  --plate-soft:rgba(59,26,122,.55);
  --line:rgba(185,166,255,.16);
  --line-strong:rgba(185,166,255,.7);
  --ph:#FFD666;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --col:720px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:var(--cyan)}
a:hover{color:var(--lav)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
[id]{scroll-margin-top:84px}
svg{flex:none}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{width:100%;max-width:calc(var(--col) + 32px);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sec{padding-block:48px 0}
.h2{margin:0 0 18px;font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.015em;text-wrap:balance}
.ph{color:var(--ph);background:rgba(255,214,102,.14);outline:1px dashed rgba(255,214,102,.55);border-radius:4px;padding:0 3px}
.tag{color:var(--cyan);font-weight:700;text-decoration:none}
a.tag:hover{color:var(--lav)}

/* Шапка */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(18,10,42,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hdr-in{height:64px;display:flex;align-items:center;gap:8px}
.logo{color:var(--text);text-decoration:none;font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-right:auto}
.logo:hover{color:var(--text)}
.lang{display:flex;padding:2px;border-radius:999px;background:var(--plate);border:1px solid rgba(185,166,255,.22)}
.lang button{border:0;border-radius:999px;min-width:54px;height:44px;padding:0 12px;background:transparent;color:var(--text);font:700 13px/1 var(--font);letter-spacing:.05em;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.hdr-rules{display:inline-flex;align-items:center;height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line-strong);color:var(--text);text-decoration:none;font-size:14px;font-weight:600;white-space:nowrap}
.hdr-rules:hover{color:var(--text);background:rgba(185,166,255,.12)}

/* Первый экран */
.hero{padding-block:28px 0}
.hero-brand{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.hashtag{margin:0;display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:999px;border:1.5px solid var(--cyan);color:var(--cyan);font-size:15px;font-weight:700}
.h1{margin:0;font-size:clamp(27px,7.2vw,42px);line-height:1.12;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.h1 span{display:block}
.h1 .h1-2{color:var(--lav)}
.chips{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.chips li{padding:6px 12px;border-radius:999px;background:rgba(59,26,122,.75);border:1px solid rgba(185,166,255,.2);font-size:14px;font-weight:500;line-height:1.3}
.packs{position:relative;isolation:isolate;max-width:560px;margin:28px auto 24px;padding:8px 0 10px;display:flex;flex-direction:column}
.packs::before{content:"";position:absolute;z-index:-1;inset:4% 0 0;border-radius:50%;background:radial-gradient(closest-side,rgba(172,73,222,.55),rgba(59,26,122,.25) 60%,rgba(18,10,42,0));pointer-events:none}
.pack{display:block;width:86%;max-width:100%;height:auto;filter:drop-shadow(0 16px 22px rgba(0,0,0,.5))}
.pack + .pack{margin-top:-8%}
.pack:nth-child(odd){align-self:flex-start;rotate:-4deg}
.pack:nth-child(even){align-self:flex-end;rotate:3deg}
.pack:nth-child(2){animation-delay:-2s}
.pack:nth-child(3){animation-delay:-4s}
.pack:nth-child(4){animation-delay:-1s}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 18px;border-radius:16px;text-decoration:none;line-height:1.2;text-align:center}
.mask-link{display:flex;align-items:stretch;gap:4px;min-height:58px;text-decoration:none;color:var(--text);border-radius:16px}
.mask-link-hero{flex:1 1 300px;filter:drop-shadow(0 12px 22px rgba(172,73,222,.4))}
.step-cta .mask-link{flex:1 1 auto}
.mask-ico{flex:none;width:58px;height:auto;min-height:58px;object-fit:cover;border-radius:16px 6px 6px 16px;background:var(--plate)}
.mask-btn{flex:1 1 auto;min-width:0;display:flex;align-items:center;justify-content:center;padding:10px 16px;border-radius:6px 16px 16px 6px;background:var(--accent);color:var(--text);font-size:19px;font-weight:700;line-height:1.2;text-align:center}
.step-cta .mask-btn{font-size:16px;padding:10px 12px}
.mask-link:hover{color:var(--text)}
.mask-link:hover .mask-btn{background:#BC5FEA}
.btn-ghost{flex:1 1 200px;min-height:54px;border:1.5px solid var(--line-strong);color:var(--text);font-size:17px;font-weight:600}
.btn-ghost:hover{color:var(--text);background:rgba(185,166,255,.12)}
.fine{margin:14px 0 0;font-size:13px;line-height:1.45;color:var(--lav)}

/* Итоги */
.results{border-radius:24px;padding:20px;background:var(--plate);border:1.5px solid var(--cyan)}
.results h2{margin:0 0 8px;font-size:24px;line-height:1.2;font-weight:800;color:var(--cyan)}
.results p{margin:6px 0 0}

/* Как участвовать */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.step{display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:20px;background:var(--plate-soft);border:1px solid var(--line)}
.step p{margin:0;min-width:0}
.step-ic{position:relative;flex:none;width:48px;height:48px;border-radius:14px;background:var(--accent);color:var(--text);display:flex;align-items:center;justify-content:center}
.step-n{position:absolute;top:-7px;left:-7px;width:22px;height:22px;border-radius:999px;background:var(--cyan);color:var(--bg);font-size:12px;font-weight:800;line-height:22px;text-align:center}
.step-ext{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto 1fr;gap:14px}
.step-ext > .mini-packs,.step-ext > .step-cta,.step-ext > .step-notes{grid-column:1/-1}
.step-notes{align-self:end;display:grid;gap:8px;margin-top:4px}
.mini-packs{display:grid;gap:12px;align-content:start;margin-top:4px}
.step-cta{align-self:end;display:flex;margin-top:4px}
.mp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px}
.mp{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.mp img{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.mp figcaption{font-size:13px;line-height:1.3;color:var(--lav);text-align:center}
.only{margin:0;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(111,231,255,.12);border:1px solid var(--cyan);color:var(--text);font-size:14px;font-weight:600;line-height:1.35}
.only svg{color:var(--cyan)}
.logo-svg{display:block;width:auto}
.note{margin:14px 0 0;display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:16px;border:1px dashed rgba(185,166,255,.45);color:var(--lav);font-size:15px;font-weight:600}
.mask{display:flex;justify-content:center;margin-top:22px}
.mask video,.mask-demo{width:176px;max-width:100%;aspect-ratio:9/16;border-radius:30px;border:2px solid rgba(185,166,255,.5);box-shadow:0 20px 50px rgba(172,73,222,.25)}
.mask-demo{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--plate) 0%,var(--bg) 75%)}
.mask-frame{position:absolute;top:30%;bottom:34%;left:8%;right:8%;border:2px dashed rgba(111,231,255,.7);border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.mask-pack{display:block;width:92%;height:auto;rotate:-8deg}
.mask-scan{position:absolute;left:0;right:0;top:12%;height:2px;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}

/* Сохрани чек */
.check{background:var(--cyan);color:var(--bg);border-radius:28px;padding:24px 20px;box-shadow:0 22px 60px rgba(111,231,255,.2)}
.check-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.check-head h2{margin:0;font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.check-ic{flex:none;width:58px;height:58px;border-radius:18px;background:var(--bg);color:var(--cyan);display:flex;align-items:center;justify-content:center}
.check-list{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.check-list li{display:flex;gap:12px;align-items:flex-start}
.check-list svg{color:var(--plate);margin-top:1px}
.check-list .strong{font-weight:600}
.check-tip{margin:18px 0 0;display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--bg);color:var(--cyan);font-size:15px;font-weight:600;line-height:1.4}

/* Приз */
.prize{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.card{padding:18px;border-radius:20px;border:1px solid var(--line)}
.card h3{margin:0 0 12px;font-size:18px;line-height:1.3;font-weight:700}
.card-in{background:var(--plate-soft);border-color:rgba(111,231,255,.35)}
.card-in h3{color:var(--cyan)}
.card-out{background:rgba(59,26,122,.3)}
.card-out h3{color:var(--lav)}
.ticks{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.ticks li{display:flex;gap:10px;align-items:flex-start}
.ticks span{min-width:0}
.card-in .ticks svg{color:var(--cyan);margin-top:1px}
.card-out .ticks svg{color:var(--lav);margin-top:1px}
.terms{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:12px;font-size:15px}
.terms li{display:flex;gap:10px;align-items:flex-start}
.terms svg{color:var(--lav);margin-top:2px}
.gifts{padding:20px;border-radius:24px;background:var(--plate);border:1px solid rgba(111,231,255,.35);display:grid;gap:14px}
.gifts h2{margin:0;font-size:26px;line-height:1.15;font-weight:800;letter-spacing:-.01em;color:var(--cyan);text-wrap:balance}
.gifts-media{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:8px;align-items:center}
.gifts-media img{display:block;width:100%;max-width:100%;height:auto;filter:drop-shadow(0 14px 22px rgba(0,0,0,.4))}
.gifts p{margin:0}
.gifts-note{padding:12px 14px;border-radius:14px;background:rgba(18,10,42,.45);font-weight:600}
.disclaimer{margin:20px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.5;color:var(--lav)}

/* Сроки */
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 24px 34px}
.timeline li::before{content:"";position:absolute;left:0;top:5px;width:16px;height:16px;border-radius:999px;background:var(--cyan);box-shadow:0 0 0 5px rgba(111,231,255,.16)}
.timeline li:not(:last-child)::after{content:"";position:absolute;left:7px;top:27px;bottom:3px;width:2px;border-radius:2px;background:rgba(185,166,255,.3)}
.tl-date{margin:0;font-size:17px;line-height:1.35;font-weight:700}
.tl-desc{margin:4px 0 0;font-size:15px;color:var(--lav)}

/* Кто может участвовать */
.who{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.who li{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--plate-soft);border:1px solid var(--line)}
.who .yes{flex:none;width:30px;height:30px;border-radius:999px;background:var(--cyan);color:var(--bg);display:flex;align-items:center;justify-content:center}
.who li.no{align-items:flex-start;background:transparent;border-style:dashed;border-color:rgba(185,166,255,.4);color:var(--lav);font-size:15px}
.who .x{flex:none;width:30px;height:30px;border-radius:999px;border:1.5px solid var(--lav);display:flex;align-items:center;justify-content:center}

/* Победитель */
.win{list-style:none;margin:0;padding:0;display:grid;gap:16px}
.win li{display:flex;gap:14px;align-items:flex-start}
.win p{margin:0;padding-top:9px;min-width:0}
.win .muted{font-size:15px;color:var(--lav)}
.win-ic{flex:none;width:44px;height:44px;border-radius:14px;background:var(--plate);color:var(--cyan);display:flex;align-items:center;justify-content:center}

/* Аккордеоны */
.acc{display:grid;gap:10px}
.qa{border-radius:18px;background:var(--plate-soft);border:1px solid var(--line);overflow:hidden}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:58px;padding:14px 16px;font-weight:600;line-height:1.35}
summary::-webkit-details-marker{display:none}
summary span{min-width:0}
summary:focus-visible{outline-offset:-3px;border-radius:16px}
.chev{margin-left:auto;color:var(--lav);transition:transform .2s ease}
details[open] > summary .chev{transform:rotate(180deg)}
.qa-a{padding:0 16px 16px;font-size:15.5px;line-height:1.55}
.rules{border-radius:20px;border:1px solid rgba(185,166,255,.2);overflow:hidden}
.rule + .rule{border-top:1px solid var(--line)}
.rule-n{flex:none;min-width:30px;height:30px;padding:0 6px;border-radius:9px;background:var(--plate);color:var(--lav);font-size:13px;font-weight:700;line-height:30px;text-align:center;font-variant-numeric:tabular-nums}
.rule-body{padding:0 16px 18px 58px;font-size:15px;line-height:1.6}
.rule-body p{margin:0 0 10px}
.rule-body p.li{margin:0 0 6px;padding-left:16px;text-indent:-16px}
@media (max-width:480px){.rule-body{padding-left:16px}}
.notice{margin:0 0 14px;padding:14px 16px;border-radius:16px;background:rgba(111,231,255,.12);border:1px solid var(--cyan)}
.notice p{margin:0}
.notice a{display:inline-block;margin-top:6px;font-weight:600}
.edition{margin:14px 0 0;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--lav)}

/* Подвал */
.ftr{margin-top:56px;background:rgba(59,26,122,.35);border-top:1px solid var(--line)}
.ftr-in{padding-block:32px 40px;display:flex;flex-direction:column;gap:12px;font-size:13px;line-height:1.55;color:var(--lav)}
.ftr-in p{margin:0}
.ftr-in .main{color:var(--text)}
.ftr-in .small{font-size:12.5px}
.ftr-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.ftr-logo{color:var(--text);font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1}
.age{flex:none;width:46px;height:46px;border-radius:999px;border:2px solid var(--text);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;letter-spacing:-.02em}

@keyframes float{50%{translate:0 -7px}}
@keyframes scan{from{top:12%}to{top:86%}}
@media (prefers-reduced-motion:no-preference){
  html{scroll-behavior:smooth}
  .pack{animation:float 6s ease-in-out infinite}
  .mask-scan{animation:scan 2.8s ease-in-out infinite alternate}
}
</style>
</head>

  /* =====================================================================
     ЛОГИКА
     ===================================================================== */
  var STORE_KEY = 'biomedtour-lang';
  var each = function (list, fn) { Array.prototype.forEach.call(list, fn); };

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // Подстановка данных в [...], подсветка хештега и аккаунта
  function fmt(str, lang) {
    return esc(str).replace(/( ?)\[([^\]]*)\]|#biomedtour|@biomed\.qazaqstan|biomed@dvasoroksem\.com/g, function (m, sp, key) {
      if (key !== undefined) {
        var v = DATA[lang] ? DATA[lang][key] : null;
        if (v === null || v === undefined) return sp + '<span class="ph">[' + key + ']</span>';
        if (v === '') return '';
        if (key === 'ссылка') return sp + '<a href="' + esc(v) + '" target="_blank" rel="noopener">' + esc(v) + '</a>';
        return sp + esc(v);
      }
      if (m === '#biomedtour') return '<span class="tag">#biomedtour</span>';
      if (m === 'biomed@dvasoroksem.com') return '<a class="tag" href="mailto:biomed@dvasoroksem.com">biomed@dvasoroksem.com</a>';
      return '<a class="tag" href="https://www.tiktok.com/@biomed.qazaqstan" target="_blank" rel="noopener">@biomed.qazaqstan</a>';
    });
  }

  // Части одного текста: заголовок по «|», подзаголовок по « · », даты по первому « — »
  function part(str, key, idx) {
    var parts;
    if (key.charAt(0) === '5' && key !== '5.1') {
      var at = str.indexOf(' — ');
      parts = at < 0 ? [str, ''] : [str.slice(0, at), str.slice(at + 3)];
    } else if (key === '1.3') {
      parts = str.split(' · ');
    } else {
      parts = str.split('|');
    }
    return parts[idx] || '';
  }

  function apply(lang) {
    var T = TEXTS[lang];
    document.documentElement.lang = lang;

    each(document.querySelectorAll('[data-t]'), function (el) {
      var key = el.getAttribute('data-t');
      var p = el.getAttribute('data-part');
      var s = T[key];
      if (s === undefined) return;
      s = p === null ? s.replace(/\|/g, ' ') : part(s, key, Number(p));
      el.innerHTML = fmt(s, lang);
    });

    each(document.querySelectorAll('[data-rule]'), function (el) {
      var i = Number(el.getAttribute('data-rule')) - 1;
      var body = RULES[lang] && RULES[lang][i];
      el.innerHTML = body && body.length
        ? body.map(function (s) {
            return '<p' + (s.indexOf('— ') === 0 ? ' class="li"' : '') + '>' + fmt(s, lang) + '</p>';
          }).join('')
        : fmt(T['rule-empty'], lang);
    });


    var notice = document.getElementById('rules-notice');
    var n = RULES_NOTICE[lang];
    if (n && n.text) {
      notice.innerHTML = '<p>' + esc(n.text) + '</p>' +
        (RULES_NOTICE.prevUrl && n.linkText ? '<a href="' + esc(RULES_NOTICE.prevUrl) + '" target="_blank" rel="noopener">' + esc(n.linkText) + '</a>' : '');
      notice.hidden = false;
    } else {
      notice.hidden = true;
    }

    document.title = T['9.9'];
    var desc = document.querySelector('meta[name="description"]');
    if (desc) desc.setAttribute('content', T['9.10']);

    each(document.querySelectorAll('[data-lang]'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-lang') === lang ? 'true' : 'false');
    });
  }

  function initialLang() {
    try {
      var q = new URLSearchParams(window.location.search).get('lang');
      if (q === 'kk' || q === 'ru') return q;
    } catch (e) {}
    try {
      var saved = window.localStorage.getItem(STORE_KEY);
      if (saved === 'kk' || saved === 'ru') return saved;
    } catch (e) {}
    var nav = (navigator.language || '').toLowerCase();
    return nav.indexOf('kk') === 0 ? 'kk' : 'ru';
  }

  // Якоря #p1…#p12 сразу раскрывают нужный раздел правил
  function openFromHash() {
    var id = (window.location.hash || '').slice(1);
    if (/^p([1-9]|1[0-2])$/.test(id)) {
      var d = document.getElementById(id);
      if (d && !d.open) d.open = true;
    }
  }

  each(document.querySelectorAll('[data-lang]'), function (b) {
    b.addEventListener('click', function () {
      var lang = b.getAttribute('data-lang');
      apply(lang);
      try { window.localStorage.setItem(STORE_KEY, lang); } catch (e) {}
    });
  });

  document.getElementById('results').hidden = !SHOW_RESULTS;
  apply(initialLang());
  openFromHash();
  window.addEventListener('hashchange', openFromHash);
})();
